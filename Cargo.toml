[workspace]
members = [
  "crates/kensa-core",
  "crates/kensa-server",
  "crates/kensa-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kensa-sh/kensa"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = "1.18.1"

