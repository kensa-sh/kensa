name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} python -m coverage run -m pytest -q -m "not live"
      - run: uv run --python ${{ matrix.python-version }} python -m coverage report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release notes match pull request base
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.event.pull_request.head.ref, 'chore/release-v') &&
          startsWith(github.event.pull_request.title, 'chore: release ')
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          source scripts/release.sh
          assert_release_notes_base "$PR_BODY" "$PR_BASE_SHA"
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          python scripts/changelog.py check-docs "$version"
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - name: Verify generated release changelog
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.event.pull_request.head.ref, 'chore/release-v') &&
          startsWith(github.event.pull_request.title, 'chore: release ')
        run: |
          version="$(uv version --short)"

          # One-release exception for 0.22.0. The framework-discovery commits are siblings of the
          # v0.21.0 tag commit rather than descendants, because the feature branch merged main into
          # itself before merging back. Topological order is undefined between siblings, so git-cliff
          # falls back to commit time and files those commits under the already-released 0.21.0.
          # CHANGELOG.md is corrected by hand here and cannot match generated output. Delete this
          # branch once 0.22.0 ships; later releases verify normally.
          if [ "$version" = "0.22.0" ]; then
            echo "::warning::skipping changelog verification for 0.22.0; CHANGELOG.md is corrected by hand"
            exit 0
          fi

          uv run git-cliff \
            --config cliff.toml \
            --repository . \
            --tag "v$version" \
            --output /tmp/CHANGELOG.md
          diff --unified CHANGELOG.md /tmp/CHANGELOG.md
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - run: uv build

  # Run redaction with real spaCy/Presidio dependencies and the pinned small model.
  redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - run: uv pip install ".[redaction]"
      - run: uv run pytest -q -m "not live"
      - run: uv run pytest tests/integration/test_live_redaction.py -q --run-live
