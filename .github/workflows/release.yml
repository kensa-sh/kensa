name: Release

run-name: Release ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'satyaborg' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'chore/release-v') &&
      startsWith(github.event.pull_request.title, 'chore: release ') &&
      contains(github.event.pull_request.labels.*.name, 'ignore-for-release')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Validate release pull request
        id: release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("sdk/python/pyproject.toml").read_text())["project"]["version"])')"
          lock_version="$(grep -A1 '^name = "kensa"$' uv.lock | grep -m1 '^version = ' | sed -E 's/^version = "(.*)"$/\1/')"
          tag="v$version"

          if [ "$PR_BRANCH" != "chore/release-$tag" ]; then
            echo "::error::release branch ($PR_BRANCH) does not match chore/release-$tag"
            exit 1
          fi
          if [ "$PR_TITLE" != "chore: release $version" ]; then
            echo "::error::release title ($PR_TITLE) does not match chore: release $version"
            exit 1
          fi
          if [ "$version" != "$lock_version" ]; then
            echo "::error::sdk/python/pyproject.toml ($version) does not match uv.lock ($lock_version)"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo "::error::checked out commit does not match merged release commit $MERGE_SHA"
            exit 1
          fi

          git fetch --quiet --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$MERGE_SHA" refs/remotes/origin/main; then
            echo "::error::merged release commit $MERGE_SHA is not on origin/main"
            exit 1
          fi

          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kensa-engine build
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} python -m coverage run -m pytest -q -m "not live"
      - run: uv run --python ${{ matrix.python-version }} python -m coverage report

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  redaction:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kensa-engine build
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - run: uv sync --group dev --all-packages --extra redaction
      - run: uv run pytest -q -m "not live"
      - run: uv run pytest sdk/python/tests/integration/test_live_redaction.py -q --run-live

  build-wheels:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17
          cache: pnpm
      - name: Resolve baseline Bun download
        if: matrix.target == 'win32-x64'
        id: windows_bun
        shell: bash
        run: |
          version="$(tr -d '\r\n' < .bun-version)"
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v$version/bun-windows-x64-baseline.zip" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: matrix.target != 'win32-x64'
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: matrix.target == 'win32-x64'
        with:
          bun-download-url: ${{ steps.windows_bun.outputs.url }}
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.11
      - name: Verify package version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          pkg_version="$(uv version --package kensa --short)"
          lock_version="$(grep -A1 '^name = "kensa"$' uv.lock | grep -m1 '^version = ' | sed -E 's/^version = "(.*)"$/\1/')"
          echo "release=$VERSION pyproject=$pkg_version uv.lock=$lock_version"
          if [ "$VERSION" != "$pkg_version" ] || [ "$VERSION" != "$lock_version" ]; then
            echo "::error::release ($VERSION) does not match sdk/python/pyproject.toml ($pkg_version) / uv.lock ($lock_version)"
            exit 1
          fi
      - run: node scripts/build-engine-wheel.mjs ${{ matrix.target }}
      - run: uv run --no-project --python 3.11 scripts/verify-engine-wheel.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheel-${{ matrix.target }}
          path: dist/*.whl
          compression-level: 0

  package-npm:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify package versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-typescript-version.mjs --check "$VERSION"
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: mkdir -p dist/npm
      - run: pnpm --filter @kensa/core pack --pack-destination "$GITHUB_WORKSPACE/dist/npm"
      - run: pnpm --filter @kensa/sdk pack --pack-destination "$GITHUB_WORKSPACE/dist/npm"
      - run: npm install --global npm@11.5.1
      - run: node scripts/verify-npm-packages.mjs dist/npm
      - uses: actions/upload-artifact@v7
        with:
          name: dist-npm
          path: |
            dist/npm/*.tgz
            dist/npm/kensa-build-manifest.json

  tag:
    needs: [prepare, test, lint, redaction, build-wheels, package-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create release tag
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          status=$?
          set -e

          case "$status" in
            0)
              git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
              existing_sha="$(git rev-list -n 1 "$TAG")"
              if [ "$existing_sha" != "$SHA" ]; then
                echo "::error::$TAG points to $existing_sha instead of $SHA"
                exit 1
              fi
              echo "$TAG already points to $SHA"
              ;;
            2)
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "$SHA" -m "Release $TAG"
              git push origin "refs/tags/$TAG"
              ;;
            *)
              echo "::error::failed to inspect origin for $TAG"
              exit 1
              ;;
          esac

  publish-pypi:
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kensa/${{ needs.prepare.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-wheel-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm-core:
    needs: [prepare, tag, package-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: dist-npm
          path: dist/npm
      - name: Publish core via Trusted Publishing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm publish "dist/npm/kensa-core-$VERSION.tgz"

  publish-npm-sdk:
    needs: [prepare, tag, package-npm, publish-npm-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: dist-npm
          path: dist/npm
      - name: Publish SDK via Trusted Publishing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm publish "dist/npm/kensa-sdk-$VERSION.tgz"

  github-release:
    needs: [prepare, publish-pypi, publish-npm-core, publish-npm-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: dist-npm
          path: dist/npm
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release create "$TAG" dist/*.whl dist/npm/kensa-build-manifest.json
          --title "$TAG" --generate-notes --verify-tag
