name: Release

run-name: Release ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'satyaborg' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'chore/release-v') &&
      startsWith(github.event.pull_request.title, 'chore: release ') &&
      contains(github.event.pull_request.labels.*.name, 'ignore-for-release')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Validate release pull request
        id: release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          source scripts/release.sh
          assert_release_notes_base "$PR_BODY" "$PR_BASE_SHA"

          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          lock_version="$(grep -A1 '^name = "kensa"$' uv.lock | grep -m1 '^version = ' | sed -E 's/^version = "(.*)"$/\1/')"
          tag="v$version"
          python scripts/changelog.py check-docs "$version"

          if [ "$PR_BRANCH" != "chore/release-$tag" ]; then
            echo "::error::release branch ($PR_BRANCH) does not match chore/release-$tag"
            exit 1
          fi
          if [ "$PR_TITLE" != "chore: release $version" ]; then
            echo "::error::release title ($PR_TITLE) does not match chore: release $version"
            exit 1
          fi
          if [ "$version" != "$lock_version" ]; then
            echo "::error::pyproject.toml ($version) does not match uv.lock ($lock_version)"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo "::error::checked out commit does not match merged release commit $MERGE_SHA"
            exit 1
          fi

          git fetch --quiet --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$MERGE_SHA" refs/remotes/origin/main; then
            echo "::error::merged release commit $MERGE_SHA is not on origin/main"
            exit 1
          fi

          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} python -m coverage run -m pytest -q -m "not live"
      - run: uv run --python ${{ matrix.python-version }} python -m coverage report

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  redaction:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - run: uv pip install ".[redaction]"
      - run: uv run pytest -q -m "not live"
      - run: uv run pytest tests/integration/test_live_redaction.py -q --run-live

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - name: Verify package version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pkg_version="$(uv version --short)"
          lock_version="$(grep -A1 '^name = "kensa"$' uv.lock | grep -m1 '^version = ' | sed -E 's/^version = "(.*)"$/\1/')"
          echo "release=$VERSION pyproject=$pkg_version uv.lock=$lock_version"
          if [ "$VERSION" != "$pkg_version" ] || [ "$VERSION" != "$lock_version" ]; then
            echo "::error::release ($VERSION) does not match pyproject.toml ($pkg_version) / uv.lock ($lock_version)"
            exit 1
          fi
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  tag:
    needs: [prepare, test, lint, redaction, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create release tag
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          status=$?
          set -e

          case "$status" in
            0)
              git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
              existing_sha="$(git rev-list -n 1 "$TAG")"
              if [ "$existing_sha" != "$SHA" ]; then
                echo "::error::$TAG points to $existing_sha instead of $SHA"
                exit 1
              fi
              echo "$TAG already points to $SHA"
              ;;
            2)
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "$SHA" -m "Release $TAG"
              git push origin "refs/tags/$TAG"
              ;;
            *)
              echo "::error::failed to inspect origin for $TAG"
              exit 1
              ;;
          esac

  publish-pypi:
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kensa/${{ needs.prepare.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/changelog.py notes "$VERSION" | gh release create "$TAG" dist/* --title "$TAG" --notes-file - --verify-tag
