[tool.uv.workspace]
members = ["sdk/python"]

[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.ty.src]
include = ["sdk/python/src", "sdk/python/tests"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "anthropic: live Anthropic provider integration tests",
  "kensa(trials=N, timeout_s=SECONDS): mark a pytest Kensa eval",
  "live: opt-in tests that call external services",
  "openai: live OpenAI provider integration tests",
]

[tool.coverage.run]
source = ["sdk/python/src/kensa"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "PIE", "C4", "RET", "PERF"]

[tool.ruff.lint.isort]
known-first-party = ["kensa"]

[dependency-groups]
dev = [
  "build>=1.3",
  "coverage>=7.15.0",
  "hatchling>=1.32.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.20",
  "ty>=0.0.69",
]
